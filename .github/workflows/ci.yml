name: BookNest CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booknest_test
          POSTGRES_USER: booknest
          POSTGRES_PASSWORD: booknest-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booknest -d booknest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://booknest:booknest-test-password@localhost:5432/booknest_test
      E2E_DATABASE_URL: postgresql://booknest:booknest-test-password@127.0.0.1:5432/booknest_test
      ADMIN_EMAIL: integration-1gration-password-123
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Static JavaScript checks
        run: npm run check
      - name: Pre-deploy safety checks
        run: npm run predeploy:check
      - name: Migrate disposable CI database
        run: npm run migrate
      - name: Validate API contract
        run: npm run openapi:check
      - name: Tests and coverage thresholds (lines 70%, branches 65%, functions 60%)
        run: npm run test:coverage
      - name: Business module coverage threshold (80% lines)
        run: npm run test:coverage:business
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Build application
        run: npm run build:pages
      - name: Install cross-browser test browsers
        run: npx playwright install --with-deps chrome msedge webkit
      - name: Run Chrome, Edge, and mobile Safari E2E
        run: npm run test:e2e
      - name: Upload browser screenshots, traces, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-reports
          path: |
            test-results/e2e/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Security audit
        run: npm audit
