name: BookNest CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booknest_test
          POSTGRES_USER: booknest
          POSTGRES_PASSWORD: booknest-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booknest -d booknest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://booknest:booknest-test-password@localhost:5432/booknest_test
      ADMIN_EMAIL: integration-admin@example.com
      ADMIN_PASSWORD: integration-password-123
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Static JavaScript checks
        run: npm run check
      - name: Tests and coverage thresholds (lines 60%, branches 60%, functions 45%)
        run: npm run test:coverage
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Build application
        run: npm run build:pages
      - name: Security audit
        run: npm audit --omit=dev
