services:
  backend:
    build:
      context: .
    image: booknest-backend:local
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5173,http://localhost:5173"
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  backend-data:
