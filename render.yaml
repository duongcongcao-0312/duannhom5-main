services:
  - type: web
    name: duannhom5-main
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: npm ci
    startCommand: npm run predeploy:check && npm run migrate && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_TTL_MS
        value: 28800000
      - key: MAX_CONCURRENT_REQUESTS
        value: 100
      - key: REQUEST_TIMEOUT_MS
        value: 30000
      - key: DATABASE_URL
        sync: false
      - key: EXPECTED_DATABASE_NAME
        sync: false
      - key: RATE_LIMIT_HMAC_KEY
        sync: false
      - key: RATE_LIMIT_TRUSTED_PROXY_HOPS
        sync: false
      - key: RATE_LIMIT_TRUSTED_PROXY_IPS
        sync: false
      - key: SEPAY_API_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: MONITORING_ALERT_WEBHOOK_URL
        sync: false
      - key: SEPAY_BANK_CODE
        sync: false
      - key: SEPAY_BANK_NAME
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_ACCOUNT_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        value: https://duongcongcao-0312.github.io/duannhom5-main/
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CORS_ORIGINS
        value: https://duongcongcao-0312.github.io
